name: Supabase keepalive

on:
  schedule:
    - cron: "17 6 */4 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_KEEPALIVE_TABLE: ${{ vars.SUPABASE_KEEPALIVE_TABLE || 'keepalive' }}
          SUPABASE_KEEPALIVE_SCHEMA: ${{ vars.SUPABASE_KEEPALIVE_SCHEMA || 'public' }}
        run: python scripts/supabase_keepalive.py
