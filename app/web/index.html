<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <meta
    name="description"
    content="PitLap - Dove il modellismo si incontra. Piste, eventi, negozi e community per vivere il modellismo in modo piu' umano e concreto."
  >

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PitLap">
  <meta property="og:title" content="PitLap - Dove il modellismo si incontra">
  <meta property="og:description" content="Piste, eventi, negozi e community del modellismo RC. Scopri lo stato delle piste in tempo reale e chi sta arrivando.">
  <meta property="og:url" content="https://pitlap.app">
  <meta property="og:image" content="https://pitlap.app/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="PitLap - Dove il modellismo si incontra">
  <meta name="twitter:description" content="Piste, eventi, negozi e community del modellismo RC.">
  <meta name="twitter:image" content="https://pitlap.app/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PitLap">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PitLap - Dove il modellismo si incontra</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      background: #f6f4ef;
      color-scheme: light;
      margin: 0;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
